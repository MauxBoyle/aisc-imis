site_name: aisc-imis
site_description: Documentation for aisc-imis

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Usage: usage.md
  - Membership Source Inventory: membership-source-inventory.md
  - Membership Date Semantics: membership-date-semantics.md
  - Membership Lifecycle Taxonomy: membership-lifecycle-taxonomy.md
  - Versioned Lifecycle Rules: lifecycle-rules.md
  - Membership History Architecture: membership-history-architecture.md
  - Evidence Ledger: evidence-ledger.md
  - Lifecycle Period Movements: lifecycle-period-movements.md
  - Quarterly Board Movements: quarterly-board-movements.md
  - M1 Membership Numbers: m1-membership-numbers.md
  - Operational Membership Summaries: operational-membership-summaries.md
  - Explainable Membership Trends: membership-trends.md
  - Reconciliation Finding Taxonomy: finding-taxonomy.md
  - Reviewed Exception Registry: reviewed-exception-registry.md
  - Pending Board Actions: board-pending-actions.md
  - Board-adjusted Membership: board-adjusted-membership.md
  - Normalization Contracts: normalization-contracts.md
  - Member Identifier Map: member-identifier-map.md
  - API Reference: api.md
